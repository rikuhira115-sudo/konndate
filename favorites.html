<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>お気に入り｜献立日和</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');
:root{--ink:#24332c;--muted:#748078;--paper:#f7f5ef;--card:#fffefa;--green:#426b50;--mint:#e8efe6;--line:#e5e8df;--shadow:0 18px 50px rgba(35,53,41,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#e8efe3 0,transparent 35%),var(--paper);font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--ink)}.shell{width:min(100% - 30px,760px);margin:auto;padding:26px 0 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:44px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:var(--green);color:#fff;font-size:23px}.brand-name{font-size:18px;font-weight:800}.sub{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted)}.link{padding:10px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:12px;font-weight:800;background:#ffffffb8}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--green)}h1{font-size:clamp(30px,6vw,43px);letter-spacing:-.04em;margin:10px 0}.desc{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 26px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:21px;box-shadow:0 10px 28px #24332c08}.card h2{font-size:18px;margin:0 0 16px;overflow-wrap:anywhere}.recipe{color:var(--green);font-size:12px;font-weight:800;text-decoration:none}.delete{display:block;margin-top:18px;width:100%;border:1px solid var(--line);background:white;color:#8b6557;border-radius:12px;padding:10px;font-size:12px;font-weight:800}.delete:hover{background:#fff4ee}.empty{background:var(--card);border:1px dashed #cbd5c9;border-radius:22px;padding:40px 20px;text-align:center;color:var(--muted);line-height:1.9}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}.bottom{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}.primary,.secondary{border:0;border-radius:999px;padding:13px 22px;font-weight:800;font-size:13px;text-decoration:none}.primary{background:var(--green);color:#fff}.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.footer{text-align:center;color:#9aa198;font-size:11px;margin-top:38px}@media(max-width:560px){.shell{padding-top:16px}.list{grid-template-columns:1fr}.brand-name{font-size:16px}.mark{width:39px;height:39px}}
</style></head><body><div class="shell">
<header><a class="brand" href="index.html"><span class="mark">⌂</span><span><span class="brand-name">献立日和</span><span class="sub">YOUR DAILY MEAL COMPASS</span></span></a><a class="link" href="index.html">← 診断に戻る</a></header>
<main><div class="eyebrow">YOUR COLLECTION</div><h1>お気に入りの献立</h1><p class="desc">また食べたい料理を、ここにまとめておけます。</p><div id="list" class="list" aria-live="polite"></div><div class="bottom"><button id="clear" class="secondary" type="button">お気に入りをすべて削除</button><a class="primary" href="index.html">今日の献立を探す ↗</a></div></main>
<footer class="footer">献立日和 · 毎日の「何食べよう？」を、ちょっと楽しく。</footer></div>
<script>
const list=document.getElementById("list");
function getSaved(){try{const v=JSON.parse(localStorage.getItem("savedMenus")||"[]");return Array.isArray(v)?v.filter(x=>x&&typeof x.name==="string"):[];}catch(e){return [];}}
function render(){
 const saved=getSaved();list.replaceChildren();
 if(!saved.length){const empty=document.createElement("div");empty.className="empty";empty.style.gridColumn="1 / -1";const strong=document.createElement("strong");strong.textContent="お気に入りはまだ空っぽ";const p=document.createElement("span");p.textContent="診断結果の「お気に入りに追加」から保存できます。";empty.append(strong,p);list.appendChild(empty);return;}
 saved.forEach(item=>{
  const card=document.createElement("article");card.className="card";const title=document.createElement("h2");title.textContent=item.name;card.appendChild(title);
  if(typeof item.link==="string"&&/^https:\/\//.test(item.link)){const a=document.createElement("a");a.className="recipe";a.href=item.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent="レシピを探す ↗";card.appendChild(a);}
  const del=document.createElement("button");del.type="button";del.className="delete";del.textContent="この料理を削除";del.addEventListener("click",()=>{localStorage.setItem("savedMenus",JSON.stringify(getSaved().filter(x=>x.name!==item.name)));render();});card.appendChild(del);list.appendChild(card);
 });
}
document.getElementById("clear").addEventListener("click",()=>{const saved=getSaved();if(!saved.length)return;if(confirm("お気に入りをすべて削除しますか？")){localStorage.removeItem("savedMenus");render();}});
render();
</script></body></html>
