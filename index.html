<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>献立日和｜今日のごはん選び</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');
:root{--ink:#24332c;--muted:#748078;--paper:#f7f5ef;--card:#fffefa;--green:#426b50;--green-dark:#294c37;--mint:#e8efe6;--line:#e5e8df;--orange:#d88a51;--shadow:0 18px 50px rgba(35,53,41,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#e8efe3 0,transparent 35%),var(--paper);font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button,a{font:inherit}button{cursor:pointer}a{color:inherit}.shell{width:min(100% - 32px,760px);margin:0 auto;padding:26px 0 70px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:38px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:var(--green);color:white;font-size:23px;box-shadow:0 6px 16px #426b5030}.brand-name{font-size:18px;font-weight:800;letter-spacing:.04em}.brand-sub{font-size:10px;letter-spacing:.16em;color:var(--muted);display:block;margin-top:1px}.header-links{display:flex;gap:8px}.pill-link,.ghost-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#ffffffb8;text-decoration:none;color:var(--ink);font-size:12px;font-weight:700}
.hero{margin-bottom:24px}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.eyebrow:before{content:'';width:18px;height:2px;background:var(--orange);border-radius:9px}.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.35;letter-spacing:-.045em;margin:12px 0 10px;font-weight:800}.hero h1 em{font-style:normal;color:var(--green)}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.9}
.panel{background:var(--card);border:1px solid #e8e9e1;border-radius:26px;padding:clamp(20px,5vw,36px);box-shadow:var(--shadow)}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}.step-label{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.08em}.step-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.progress{height:5px;background:#edf0e8;border-radius:9px;overflow:hidden;margin-bottom:30px}.progress-inner{height:100%;width:0;background:linear-gradient(90deg,var(--green),#88a985);border-radius:9px;transition:width .3s ease}
#question{font-size:clamp(22px,4vw,29px);line-height:1.5;letter-spacing:-.035em;margin:0 0 8px;font-weight:800}#hint{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.7}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;min-height:64px;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--ink);font-weight:700;font-size:14px;transition:transform .16s,border-color .16s,background .16s,box-shadow .16s}.option-btn:after{content:'↗';font-size:15px;color:#9aa69a}.option-btn:hover{border-color:#a8bba6;background:#f8faf5;transform:translateY(-2px);box-shadow:0 7px 18px #24332c0b}.option-btn:focus-visible,.pill-link:focus-visible,.ghost-btn:focus-visible{outline:3px solid #d6a16e;outline-offset:3px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.ghost-btn{background:transparent;border-color:transparent;color:var(--muted)}.ghost-btn:disabled{opacity:.35;cursor:not-allowed}.small-note{text-align:center;font-size:11px;color:#929b92;margin:17px 0 0}
#result{margin-top:22px}.result-intro{padding:28px 8px 16px;text-align:center}.result-kicker{color:var(--green);font-weight:800;font-size:11px;letter-spacing:.18em}.result-intro h2{font-size:clamp(26px,5vw,36px);letter-spacing:-.04em;margin:9px 0}.result-intro p{color:var(--muted);font-size:13px;line-height:1.8;margin:0}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.result-card{position:relative;background:var(--card);border:1px solid #e8e9e1;border-radius:20px;padding:20px 16px;box-shadow:0 10px 28px #24332c08;animation:rise .35s both}.result-card:nth-child(2){animation-delay:.06s}.result-card:nth-child(3){animation-delay:.12s}.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:10px;background:var(--mint);color:var(--green);font-size:12px;font-weight:800;margin-bottom:15px}.result-card:first-child .rank{background:var(--green);color:white}.result-card h3{font-size:17px;line-height:1.5;margin:0 0 10px;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}.tag{font-size:10px;background:#f0f2eb;color:#667366;padding:5px 8px;border-radius:99px}.result-card a.recipe{display:block;color:var(--green);font-size:12px;font-weight:800;text-decoration:none;margin-bottom:12px}.save-btn{width:100%;border:1px solid #dfe5db;background:#fff;border-radius:12px;padding:10px 8px;color:var(--green);font-size:11px;font-weight:800}.save-btn:hover{background:var(--mint)}.save-btn.saved{background:var(--mint);border-color:var(--mint)}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.primary-btn{border:0;border-radius:999px;background:var(--green);color:#fff;padding:14px 24px;font-weight:800;font-size:13px;box-shadow:0 7px 18px #426b5026}.primary-btn:hover{background:var(--green-dark)}.secondary-btn{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:13px 22px;font-size:13px;font-weight:700}.error{padding:18px;border-radius:14px;background:#fff3e9;color:#85502d;font-size:13px;line-height:1.8}.footer{text-align:center;color:#9aa198;font-size:11px;margin-top:36px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){.shell{width:min(100% - 22px,760px);padding-top:16px}.brand-mark{width:39px;height:39px}.brand-name{font-size:16px}.brand-sub{font-size:9px}.header-links{gap:5px}.pill-link{padding:9px 11px;font-size:11px}.hero{margin-bottom:20px}.panel{border-radius:22px;padding:22px 17px}.options{grid-template-columns:1fr;gap:8px}.option-btn{min-height:57px;padding:13px 15px}.result-grid{grid-template-columns:1fr}.result-card{padding:19px}.result-card h3{font-size:19px}.rank{margin-bottom:10px}.result-card .save-btn{max-width:220px}.result-card{display:grid;grid-template-columns:1fr;justify-items:start}.result-card .save-btn{width:100%}.result-card a.recipe{margin-bottom:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header>
<a class="brand" href="index.html"><span class="brand-mark">⌂</span><span><span class="brand-name">献立日和</span><span class="brand-sub">YOUR DAILY MEAL COMPASS</span></span></a>
<nav class="header-links"><a class="pill-link" href="favorites.html">♡ お気に入り</a><button class="pill-link" id="reset-top" type="button">↻ やり直す</button></nav>
</header>
<section class="hero"><span class="eyebrow">WHAT'S FOR TODAY?</span><h1>今日のごはん、<br><em>一緒に決めよう。</em></h1><p>気分や好みに答えるだけ。<br>あなたにぴったりの献立候補を3つ提案します。</p></section>
<main>
<section class="panel" id="question-card" aria-live="polite">
<div class="panel-top"><span class="step-label" id="step-label">YOUR PREFERENCES</span><span class="step-count" id="step-count">01 / 09</span></div>
<div class="progress" aria-label="診断の進み具合"><div class="progress-inner" id="bar-inner"></div></div>
<h2 id="question">献立データを読み込んでいます…</h2><p id="hint"></p><div class="options" id="options"></div>
<div class="actions"><button class="ghost-btn" id="back-btn" type="button" disabled>← 前の質問</button><button class="ghost-btn" id="reset-btn" type="button">最初から ↻</button></div>
</section>
<section id="result" aria-live="polite"></section>
</main>
<p class="small-note">答えに正解はありません。今の気分で選んでね。</p>
<footer class="footer">献立日和 · 毎日の「何食べよう？」を、ちょっと楽しく。</footer>
</div>
<script>
const questions = [
{text:"主食は何がいい？",hint:"まずは食べたいもののベースから。",key:"主食",options:[{label:"🍚 ごはん",value:"米"},{label:"🥐 パン",value:"パン"},{label:"🍜 麺",value:"麺"},{label:"🥗 主食なし・その他",value:"なし"}]},
{text:"今日はどんなジャンル？",hint:"いつもの定番でも、ちょっと冒険でも。",key:"ジャンル",options:[{label:"🍱 和食",value:"和"},{label:"🍝 洋食",value:"洋"},{label:"🥟 中華",value:"中"},{label:"🌶️ 韓国料理",value:"韓"},{label:"🍲 エスニック",value:"エスニック"}]},
{text:"メインの食材は？",hint:"肉以外を選ぶと、魚・卵・豆腐・野菜などから探します。",key:"食材タイプ",options:[{label:"🥩 肉料理",value:"肉"},{label:"🐟 肉以外",value:"非肉"}]},
{text:"どのお肉が食べたい？",hint:"選んだお肉を使った料理を優先します。",key:"肉の種類",condition:{key:"食材タイプ",value:"肉"},options:[{label:"🐮 牛肉",value:["牛"]},{label:"🐷 豚肉",value:["豚"]},{label:"🍗 鶏肉",value:["鶏"]},{label:"🥟 ひき肉",value:["ひき","挽"]}]},
{text:"合わせたい食材は？",hint:"食材を指定しない場合は、ほかの回答を重視します。",key:"肉以外の材料",options:[{label:"🐟 魚介",value:["魚","鮭","鯖","白身","海老"]},{label:"🥬 野菜",value:["玉ねぎ","にんじん","キャベツ","野菜"]},{label:"🧈 豆腐",value:["豆腐"]},{label:"🥚 卵",value:["卵"]},{label:"✨ こだわらない",value:[]}]},
{text:"どんな味の気分？",hint:"味の好みも候補の順位に反映します。",key:"味の傾向",options:[{label:"🍖 こってり",value:"こってり"},{label:"🍚 いつもの味",value:"普通"},{label:"🍃 あっさり",value:"あっさり"}]},
{text:"ボリュームはどれくらい？",hint:"軽めから、しっかり食べたい日まで。",key:"ボリューム",options:[{label:"🌱 軽め",value:"軽い"},{label:"🙂 普通",value:"普通"},{label:"💪 がっつり",value:"重い"}]},
{text:"調理時間はどれくらい？",hint:"時間内に作れる料理を優先。長めの料理は順位を下げます。",key:"調理時間(分)",options:[{label:"⚡ 15分以内",value:15},{label:"⏱️ 30分以内",value:30},{label:"🍳 時間は気にしない",value:999}]},
{text:"いつ食べるごはん？",hint:"食事の時間に合うメニューを選びます。",key:"時間帯",options:[{label:"🌅 朝ごはん",value:"朝食"},{label:"☀️ 昼ごはん",value:"昼食"},{label:"🌙 晩ごはん",value:"夕食"},{label:"🌜 夜食",value:"夜食"}]}
];
let db=[],index=0,answers={},isFinished=false,lastResults=[];
const $=id=>document.getElementById(id);
function normalizeArray(v){return Array.isArray(v)?v:(v==null?[]:[v]);}
function hasAny(materials,keywords){return keywords.some(k=>materials.some(m=>String(m).includes(k)));}
function isMeat(item){
 const ms=normalizeArray(item["主な材料"]).map(String);
 return hasAny(ms,["牛肉","豚肉","鶏肉","ひき肉","挽肉","羊肉","肉"]);
}
function questionVisible(q,ans){return !q.condition || ans[q.condition.key]===q.condition.value;}
function visibleQuestionIndexes(){return questions.map((q,i)=>questionVisible(q,answers)?i:-1).filter(i=>i>=0);}
function renderQuestion(){
 const visible=visibleQuestionIndexes();
 if(!visible.length){finish();return;}
 while(index<questions.length && !questionVisible(questions[index],answers)) index++;
 if(index>=questions.length){finish();return;}
 const q=questions[index],step=visible.indexOf(index)+1;
 $("step-label").textContent="YOUR PREFERENCES";
 $("step-count").textContent=String(step).padStart(2,"0")+" / "+String(visible.length).padStart(2,"0");
 $("bar-inner").style.width=((step-1)/visible.length*100)+"%";
 $("question").textContent=q.text;$("hint").textContent=q.hint;
 $("options").replaceChildren();
 q.options.forEach(opt=>{
  const b=document.createElement("button");b.type="button";b.className="option-btn";b.textContent=opt.label;
  b.addEventListener("click",()=>selectAnswer(opt.value));$("options").appendChild(b);
 });
 $("back-btn").disabled=visible.indexOf(index)<=0;
 $("question-card").style.display="block";$("result").replaceChildren();isFinished=false;
}
function selectAnswer(value){
 const q=questions[index];answers[q.key]=value;
 // 分岐が変わったときに、表示されなくなった質問の回答を残さない
 questions.forEach(item=>{if(item.condition && !questionVisible(item,answers)) delete answers[item.key];});
 const visible=visibleQuestionIndexes(),pos=visible.indexOf(index);
 if(pos>=visible.length-1){finish();return;}
 index=visible[pos+1];renderQuestion();
}
function goBack(){
 const visible=visibleQuestionIndexes(),pos=visible.indexOf(index);
 if(pos<=0)return;
 delete answers[questions[index].key];index=visible[pos-1];renderQuestion();
}
function resetAll(){index=0;answers={};isFinished=false;lastResults=[];$("result").replaceChildren();$("question-card").style.display="block";renderQuestion();}
function scoreItem(item){
 let score=0;const a=answers,mats=normalizeArray(item["主な材料"]).map(String);
 // 主食・ジャンル・味・量・時間帯を個別に評価
 if(a["主食"] && item["主食"]===a["主食"])score+=5;
 if(a["ジャンル"] && item["ジャンル"]===a["ジャンル"])score+=5;
 if(a["味の傾向"] && item["味の傾向"]===a["味の傾向"])score+=4;
 if(a["ボリューム"] && item["ボリューム"]===a["ボリューム"])score+=3;
 if(a["時間帯"] && normalizeArray(item["時間帯"]).includes(a["時間帯"]))score+=3;
 if(a["調理時間(分)"]!==undefined){
  const limit=Number(a["調理時間(分)"]),mins=Number(item["調理時間(分)"]);
  if(limit===999)score+=1;else if(Number.isFinite(mins)&&mins<=limit)score+=5;else if(Number.isFinite(mins))score-=Math.min(5,Math.ceil((mins-limit)/10));
 }
 if(a["食材タイプ"]==="肉"){
  if(isMeat(item))score+=4;else score-=5;
 }else if(a["食材タイプ"]==="非肉"){
  if(isMeat(item))score-=12;else score+=5;
 }
 if(a["肉の種類"]){
  const keys=a["肉の種類"];
  if(hasAny(mats,keys))score+=7;else score-=5;
 }
 const chosen=a["肉以外の材料"];
 if(Array.isArray(chosen)&&chosen.length){
  if(hasAny(mats,chosen))score+=4;else score-=2;
 }
 return score;
}
function finish(){
 const candidates=db.filter(item=>item&&item["メニュー名"]);
 if(!candidates.length){showError("料理データが空か、読み込めませんでした。menu.json の内容を確認してください。");return;}
 const ranked=candidates.map((item,order)=>({item,score:scoreItem(item),order}));
 ranked.sort((a,b)=>b.score-a.score||a.order-b.order);
 // 上位3件は同じ料理名を重複表示せず、料理カテゴリの偏りもなるべく避ける
 const picked=[],usedNames=new Set(),usedCategories=new Set();
 for(const entry of ranked){
  const name=entry.item["メニュー名"];if(usedNames.has(name))continue;
  const cat=entry.item["料理カテゴリ"]||"その他";
  if(!usedCategories.has(cat)){picked.push(entry);usedNames.add(name);usedCategories.add(cat);}
  if(picked.length===3)break;
 }
 for(const entry of ranked){
  if(picked.length===3)break;
  const name=entry.item["メニュー名"];if(!usedNames.has(name)){picked.push(entry);usedNames.add(name);}
 }
 lastResults=picked.map(x=>x.item);isFinished=true;
 $("question-card").style.display="none";
 const root=$("result");root.replaceChildren();
 const intro=document.createElement("div");intro.className="result-intro";
 intro.innerHTML='<div class="result-kicker">TODAY’S MENU</div><h2>今日のおすすめ、3品。</h2><p>選んだ条件をもとに、相性のよい順に並べました。<br>気になる料理をチェックしてみてね。</p>';root.appendChild(intro);
 const grid=document.createElement("div");grid.className="result-grid";
 picked.forEach((entry,i)=>{
  const item=entry.item,card=document.createElement("article");card.className="result-card";
  const rank=document.createElement("span");rank.className="rank";rank.textContent=String(i+1).padStart(2,"0");
  const title=document.createElement("h3");title.textContent=item["メニュー名"];
  const meta=document.createElement("div");meta.className="meta";
  [item["調理時間(分)"]?item["調理時間(分)"]+"分":"",item["ジャンル"],item["ボリューム"]==="重い"?"がっつり":item["ボリューム"]].filter(Boolean).forEach(t=>{const tag=document.createElement("span");tag.className="tag";tag.textContent=t;meta.appendChild(tag);});
  const link=document.createElement("a");link.className="recipe";link.href="https://cookpad.com/jp/search/"+encodeURIComponent(item["メニュー名"]);link.target="_blank";link.rel="noopener noreferrer";link.textContent="レシピを探す ↗";
  const save=document.createElement("button");save.type="button";save.className="save-btn";save.textContent=isSaved(item["メニュー名"])?"✓ お気に入り登録済み":"♡ お気に入りに追加";
  if(isSaved(item["メニュー名"]))save.classList.add("saved");
  save.addEventListener("click",()=>{const ok=saveMenu(item["メニュー名"],link.href);save.textContent=ok?"✓ お気に入り登録済み":"✓ お気に入り登録済み";save.classList.add("saved");});
  card.append(rank,title,meta,link,save);grid.appendChild(card);
 });
 root.appendChild(grid);
 const actions=document.createElement("div");actions.className="result-actions";
 const again=document.createElement("button");again.className="primary-btn";again.textContent="回答を変えてもう一度 ↻";again.onclick=resetAll;
 const retry=document.createElement("button");retry.className="secondary-btn";retry.textContent="条件を少し変える ←";retry.onclick=()=>{isFinished=false;$("question-card").style.display="block";index=visibleQuestionIndexes().slice(-1)[0]||0;delete answers[questions[index].key];renderQuestion();window.scrollTo({top:0,behavior:"smooth"});};
 actions.append(again,retry);root.appendChild(actions);
 $("bar-inner").style.width="100%";window.scrollTo({top:0,behavior:"smooth"});
}
function showError(message){$("question-card").style.display="block";$("question").textContent="読み込みに失敗しました";$("hint").textContent="少し時間をおいて再読み込みしてください。";$("options").replaceChildren();const e=document.createElement("div");e.className="error";e.textContent=message;$("options").appendChild(e);}
function isSaved(name){try{return JSON.parse(localStorage.getItem("savedMenus")||"[]").some(x=>x.name===name);}catch(e){return false;}}
function saveMenu(name,link){
 try{const saved=JSON.parse(localStorage.getItem("savedMenus")||"[]");if(saved.some(x=>x.name===name))return false;saved.push({name,link});localStorage.setItem("savedMenus",JSON.stringify(saved));return true;}
 catch(e){alert("お気に入りを保存できませんでした。ブラウザの保存設定を確認してください。");return false;}
}
$("back-btn").addEventListener("click",goBack);$("reset-btn").addEventListener("click",resetAll);$("reset-top").addEventListener("click",resetAll);
fetch("./menu.json").then(res=>{if(!res.ok)throw new Error("menu.json を取得できませんでした ("+res.status+")");return res.json();}).then(data=>{if(!Array.isArray(data))throw new Error("menu.json の形式が配列ではありません");db=data;renderQuestion();}).catch(err=>showError(err.message));
</script>
</body>
</html>
