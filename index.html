<body>
<div class="shell">
<header>
<a class="brand" href="index.html"><span class="brand-mark">⌂</span><span><span class="brand-name">献立日和</span><span class="brand-sub">YOUR DAILY MEAL COMPASS</span></span></a>
<nav class="header-links"><a class="pill-link" href="favorites.html">♡ お気に入り</a><button class="pill-link" id="reset-top" type="button">↻ やり直す</button></nav>
</header>
<section class="hero"><span class="eyebrow">WHAT'S FOR TODAY?</span><h1>今日のごはん、<br><em>一緒に決めよう。</em></h1><p>気分や好みに答えるだけ。<br>あなたにぴったりの献立候補を3つ提案します。</p></section>
<main>
<section class="mode-picker" id="mode-picker" aria-labelledby="mode-heading">
 <div class="mode-heading"><span class="eyebrow">CHOOSE YOUR STYLE</span><h2 id="mode-heading">どんなふうに決める？</h2><p>さっと決めたい日も、じっくり選びたい日も。</p></div>
 <div class="mode-grid">
  <button type="button" class="mode-card" id="quick-mode"><span class="mode-icon">⚡</span><strong>かんたん診断</strong><span>3つの質問だけで、今の気分に合う候補を提案。</span><em>約30秒で完了 →</em></button>
  <button type="button" class="mode-card" id="full-mode"><span class="mode-icon">🍽️</span><strong>じっくり診断</strong><span>主食・ジャンル・食材など、細かい条件まで選べます。</span><em>好みを詳しく設定 →</em></button>
 </div>
</section>
<section class="panel" id="question-card" aria-live="polite" style="display:none">
<div class="panel-top"><span class="step-label" id="step-label">YOUR PREFERENCES</span><span class="step-count" id="step-count">01 / 09</span></div>
<div class="progress" aria-label="診断の進み具合"><div class="progress-inner" id="bar-inner"></div></div>
<h2 id="question">献立データを読み込んでいます…</h2><p id="hint"></p><div class="options" id="options"></div>
<div class="multi-actions" id="multi-actions"><button type="button" id="multi-continue">選択した食材で進む →</button><button type="button" id="multi-clear">こだわらない</button></div>
<div class="actions"><button class="ghost-btn nav-back-btn" id="back-btn" type="button" disabled>← 戻る</button><button class="ghost-btn nav-mode-btn" id="mode-back-btn" type="button">診断方法を選び直す</button><button class="ghost-btn nav-reset-btn" id="reset-btn" type="button">最初から ↻</button></div>
</section>
<section id="result" aria-live="polite"></section>
</main>
<p class="small-note" id="small-note">答えに正解はありません。今の気分で選んでね。</p>
<footer class="footer">献立日和 · 毎日の「何食べよう？」を、ちょっと楽しく。</footer>
</div>

  // LoremFlickr uses comma-separated keywords in the URL path.
  const safeTags=String(tags).toLowerCase().replace(/[^a-z0-9,-]/g,"").replace(/,+/g,",").replace(/^,|,$/g,"");
  if(safeTags)return {url:"https://loremflickr.com/800/560/"+safeTags+"?lock="+lock,page:"https://loremflickr.com/",fallback:fallback.url};
 }
 return fallback;
}
function imageEmoji(item){
 const c=item["料理カテゴリ"]||"";
 if(c==="麺")return "🍜";if(c==="中華")return "🥟";if(c==="スープ"||c==="煮物"||c==="鍋")return "🍲";
 if(c==="丼"||c==="ご飯もの")return "🍚";if(c==="揚げ物")return "🍤";if(c==="粉物")return "🥞";if(c==="パン・軽食")return "🥪";
 return "🍽️";
}
function getReasons(item){
 const a=answers,reasons=[],mats=normalizeArray(item["主な材料"]).map(String);
 if(a["主食"]&&item["主食"]===a["主食"])reasons.push(({米:"ごはんもの",麺:"麺料理",パン:"パン・サンド",なし:"おかず中心"})[a["主食"]]||"食事スタイルが一致");
 if(a["ジャンル"]&&genreMatches(item,a["ジャンル"]))reasons.push(({和:"和食の気分に合う",洋:"洋食の気分に合う",中:"中華の気分に合う","__asia__":"韓国・アジア料理"})[a["ジャンル"]]||"ジャンルが好みに一致");
 if(a["食材タイプ"]==="肉")reasons.push("肉料理から選択");
 if(a["食材タイプ"]==="魚介")reasons.push("魚介を使った料理");
 if(a["食材タイプ"]==="野菜など")reasons.push("野菜・卵・豆腐が中心");
 if(Array.isArray(a["肉の種類"])&&a["肉の種類"].length){
  const k=a["肉の種類"][0],label=k==="牛肉"?"牛肉":k==="豚肉"?"豚肉":k==="鶏肉"?"鶏肉":"ひき肉";
  reasons.push(label+"を使用");
 }
 if(a["調理時間(分)"]!==undefined&&Number(a["調理時間(分)"])!==999&&Number(item["調理時間(分)"])<=Number(a["調理時間(分)"]))reasons.push(item["調理時間(分)"]+"分で作れる");
 if(a["味の特徴"]&&normalizeArray(a["味の特徴"]).length){
  const matched=normalizeArray(item["味の特徴"]).filter(x=>normalizeArray(a["味の特徴"]).includes(x));
  const labelMap={"甘辛":"甘辛味","醤油味":"しょうゆ味","辛い":"ピリ辛","スパイシー":"スパイシー","塩味":"塩味","クリーミー":"クリーミー","味噌味":"みそ味"};
  if(matched.length)reasons.push(labelMap[matched[0]]||matched[0]);
 }
 if(a["ボリューム"]&&item["ボリューム"]===a["ボリューム"])reasons.push(({軽い:"軽め",普通:"ほどよい量",重い:"がっつり"})[a["ボリューム"]]||"ボリュームが好みに一致");
 if(a["予算帯"]&&item["予算帯"]===a["予算帯"])reasons.push(({低:"節約しやすい",中:"普段どおりの予算",高:"少し豪華な予算"})[a["予算帯"]]||"予算が好みに一致");
 selectedIngredientGroups().filter(g=>hasAny(mats,g.keywords)).forEach(g=>reasons.push(g.name+"を使用"));
 return [...new Set(reasons)].slice(0,3);
}
function renderResults(picked){
 const root=$("result");root.replaceChildren();$("question-card").style.display="none";
 const intro=document.createElement("div");intro.className="result-intro";
 intro.innerHTML='<div class="result-kicker">TODAY’S MENU</div><h2>今日のおすすめ、'+picked.length+'品。</h2><p>まず主食・食材・調理時間の条件を守り、その中から好みや予算に合う料理を選びました。</p>';root.appendChild(intro);
 const historyLabel=document.createElement("p");historyLabel.className="result-history-label";
 historyLabel.textContent="候補セット "+(resultHistoryIndex+1)+" / "+Math.max(resultHistory.length,1);
 root.appendChild(historyLabel);
 if(relaxedGenre){
  const note=document.createElement("p");note.className="result-note";note.textContent="選んだジャンルだけでは3品そろわなかったため、主食・食材・調理時間の条件を守りつつ、別ジャンルの料理も含めました。";root.appendChild(note);
 }
 if(allRanked.length<=3){
  const note=document.createElement("p");note.className="result-note";note.textContent="条件に合う料理は全部で"+allRanked.length+"種類です。候補を増やすには、食材・ジャンル・調理時間を少し広げてみてね。";root.appendChild(note);
 }
 const grid=document.createElement("div");grid.className="result-grid";
 picked.forEach((entry,i)=>{
  const item=entry.item,card=document.createElement("article");card.className="result-card";
  const photo=document.createElement("div");photo.className="food-photo";
  const selectedPhoto=photoFor(item);
  const img=document.createElement("img");img.src=selectedPhoto.url;img.alt=item["メニュー名"]+"のイメージ写真";img.loading="lazy";img.decoding="async";
  const photoLabel=document.createElement("span");photoLabel.className="photo-caption";photoLabel.textContent="イメージ写真";
  const photoCredit=document.createElement("a");photoCredit.className="photo-credit";photoCredit.textContent=selectedPhoto.page&&selectedPhoto.page.includes("loremflickr")?"画像情報 ↗":"出典: Unsplash ↗";photoCredit.href=selectedPhoto.page||"https://unsplash.com/";photoCredit.target="_blank";photoCredit.rel="noopener noreferrer";
  if(!selectedPhoto.page)photoCredit.style.display="none";
  img.onerror=()=>{if(selectedPhoto.fallback&&img.dataset.fallbackTried!=="1"){img.dataset.fallbackTried="1";img.src=selectedPhoto.fallback;photoCredit.href="https://unsplash.com/";photoCredit.textContent="出典: Unsplash ↗";return;}img.remove();photoCredit.remove();photo.classList.add("photo-fallback");const emoji=document.createElement("span");emoji.className="photo-emoji";emoji.textContent=imageEmoji(item);photo.appendChild(emoji);const fallbackText=document.createElement("span");fallbackText.className="photo-fallback-label";fallbackText.textContent="写真を読み込めませんでした";photo.appendChild(fallbackText);};
  photo.append(img,photoLabel);if(selectedPhoto.page)photo.appendChild(photoCredit);
  const body=document.createElement("div");body.className="result-card-body";
  const rank=document.createElement("span");rank.className="rank";rank.textContent=String(i+1).padStart(2,"0");
  const title=document.createElement("h3");title.textContent=item["メニュー名"];
  const meta=document.createElement("div");meta.className="meta";
  [item["調理時間(分)"]!=null?item["調理時間(分)"]+"分":"",({和:"和食",洋:"洋食",中:"中華",韓:"韓国料理",エスニック:"アジア料理"})[item["ジャンル"]]||item["ジャンル"],item["ボリューム"]==="重い"?"がっつり":item["ボリューム"]==="軽い"?"軽め":item["ボリューム"]==="普通"?"ほどよい量":""].filter(Boolean).forEach(t=>{const tag=document.createElement("span");tag.className="tag";tag.textContent=t;meta.appendChild(tag);});
  const reasonTitle=document.createElement("p");reasonTitle.className="reason-title";reasonTitle.textContent="おすすめの理由";
  const reasonList=document.createElement("div");reasonList.className="reason-list";
  (getReasons(item).length?getReasons(item):["選んだ条件との相性を総合して選びました"]).forEach(reason=>{const tag=document.createElement("span");tag.className="reason-chip";tag.textContent=reason;reasonList.appendChild(tag);});
  const link=document.createElement("a");link.className="recipe";link.href="https://cookpad.com/jp/search/"+encodeURIComponent(item["メニュー名"]);link.target="_blank";link.rel="noopener noreferrer";link.textContent="レシピを探す ↗";
  const save=document.createElement("button");save.type="button";save.className="save-btn";
  const updateSaveButton=()=>{const saved=isSaved(item["メニュー名"]);save.textContent=saved?"✓ お気に入り登録済み":"♡ お気に入りに追加";save.classList.toggle("saved",saved);};
  updateSaveButton();save.addEventListener("click",()=>{if(isSaved(item["メニュー名"]))return;if(saveMenu(item["メニュー名"],link.href))updateSaveButton();});
  body.append(rank,title,meta,reasonTitle,reasonList,link,save);card.append(photo,body);grid.appendChild(card);
 });
 root.appendChild(grid);
 const actions=document.createElement("div");actions.className="result-actions history-actions";
 const previous=document.createElement("button");previous.className="secondary-btn history-nav-btn";previous.textContent="← 前の候補";
 previous.disabled=resultHistoryIndex<=0;previous.onclick=showPreviousSet;
 const next=document.createElement("button");next.className="primary-btn history-next-btn";
 const hasNextHistory=resultHistoryIndex<resultHistory.length-1;
 const hasUnseen=allRanked.some(x=>!shownNames.has(x.item["メニュー名"]));
 next.textContent=hasNextHistory?"次の候補 →":hasUnseen?"別の候補を見る ↻":"候補は全部表示済み";
 next.disabled=!hasNextHistory&&!hasUnseen;next.onclick=showAnotherSet;
 const again=document.createElement("button");again.className="secondary-btn";again.textContent="回答を変える";again.onclick=resetAll;
 const edit=document.createElement("button");edit.className="secondary-btn";edit.textContent="条件を少し変える ←";edit.onclick=editLastAnswer;
 actions.append(previous,next,again,edit);root.appendChild(actions);
 $("bar-inner").style.width="100%";window.scrollTo({top:0,behavior:"smooth"});
}
function showPreviousSet(){
 if(resultHistoryIndex<=0)return;
 resultHistoryIndex--;
 const picked=resultHistory[resultHistoryIndex];
 lastResults=picked.map(x=>x.item);
 renderResults(picked);
}
function showAnotherSet(){
 if(!allRanked.length)return;
 // 以前に表示したセットがあれば、まず履歴の次へ進む。
 if(resultHistoryIndex<resultHistory.length-1){
  resultHistoryIndex++;
  const picked=resultHistory[resultHistoryIndex];
  lastResults=picked.map(x=>x.item);
  renderResults(picked);
  return;
 }
 const available=allRanked.filter(x=>!shownNames.has(x.item["メニュー名"]));
 if(!available.length)return;
 const picked=chooseDiverse(available);
 if(!picked.length)return;
 resultHistory.push(picked);
 resultHistoryIndex=resultHistory.length-1;
 lastResults=picked.map(x=>x.item);
 picked.forEach(x=>shownNames.add(x.item["メニュー名"]));
 renderResults(picked);
}
function editLastAnswer(){
 $("question-card").style.display="block";
 const visible=visibleQuestionIndexes();index=visible[visible.length-1]??0;
 delete answers[currentQuestions[index]?.key];$("result").replaceChildren();renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function showError(message){
 $("mode-picker").style.display="none";$("question-card").style.display="block";
 $("question").textContent="読み込みに失敗しました";$("hint").textContent="少し時間をおいて再読み込みしてください。";
 $("options").replaceChildren();const e=document.createElement("div");e.className="error";e.textContent=message;$("options").appendChild(e);
}
function isSaved(name){try{return JSON.parse(localStorage.getItem("savedMenus")||"[]").some(x=>x.name===name);}catch(e){return false;}}
function saveMenu(name,link){
 try{const saved=JSON.parse(localStorage.getItem("savedMenus")||"[]");if(saved.some(x=>x.name===name))return false;saved.push({name,link});localStorage.setItem("savedMenus",JSON.stringify(saved));return true;}
 catch(e){alert("お気に入りを保存できませんでした。ブラウザの保存設定を確認してください。");return false;}
}
$("back-btn").addEventListener("click",goBack);
$("reset-btn").addEventListener("click",resetAll);
$("reset-top").addEventListener("click",resetAll);
$("mode-back-btn").addEventListener("click",returnToModes);
$("quick-mode").addEventListener("click",()=>setMode("quick"));
$("full-mode").addEventListener("click",()=>setMode("full"));
$("multi-continue").addEventListener("click",confirmMulti);
$("multi-clear").addEventListener("click",()=>{multiDraft.clear();answers["肉以外の材料"]=[];advanceQuestion();});
fetch("./menu.json").then(res=>{if(!res.ok)throw new Error("menu.json を取得できませんでした ("+res.status+")");return res.json();}).then(data=>{
 if(!Array.isArray(data)||!data.length)throw new Error("menu.json の形式が配列ではないか、データが空です");
 db=data.filter(item=>item&&item["メニュー名"]);
 if(!db.length)throw new Error("有効な料理データがありません");
 $("mode-picker").style.display="block";
}).catch(err=>showError(err.message));
</script>
